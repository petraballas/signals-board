  if (px >= 1000) return 1;

function ema(vals, period) {
  const out = new Array(vals.length).fill(0);

  const k = 2 / (period + 1);

  left = left == null ? 3 : left; right = right == null ? 3 : right;

function countsOf(signals) {
  return {
    n: signals.length,
    longN: signals.filter((s) => s.side === "long").length,
    shortN: signals.filter((s) => s.side === "short").length,
    h1: signals.filter((s) => s.tf === "1h").length,
    h4: signals.filter((s) => s.tf === "4h").length,
  };
}
function filteredSignals() {
  return state.signals.filter((s) =>
    (state.tf === "all" || s.tf === state.tf) &&
    (state.typ === "all" || s.type === state.typ) &&
    (state.side === "all" || s.side === state.side)
  );
}
function selectedSig() {
  const f = filteredSignals();
  return f.find((s) => s.id === state.selectedId) || f[0] || state.signals[0] || null;
}
function topSig() {
  if (!state.signals.length) return null;
  return state.signals.slice().sort((a, b) => (a.tf === b.tf ? b.rr1 - a.rr1 : a.tf === "4h" ? -1 : 1))[0];
}
function calcFor(sel) {
  if (!sel) return null;
  const dep = num(state.equity), L = Math.max(num(state.lev), 1);
  const riskUsd = (dep * num(state.riskPct)) / 100;
  const dist = Math.abs(sel.entry - sel.sl);
  const qty = dist > 0 ? riskUsd / dist : 0;
  const notional = qty * sel.entry, margin = notional / L;
  const liq = sel.side === "long" ? sel.entry * (1 - 1 / L) : sel.entry * (1 + 1 / L);
  const liqBefore = sel.side === "long" ? sel.sl < liq : sel.sl > liq;
  return { riskUsd, qty, notional, margin, liq, liqBefore, L, dep };
}

async function refresh() {
  state.loading = true; state.error = "";
  renderChrome(); renderPage();
  try {
    const { book, source } = await fetchAllLive();
    const sigs = detectAll(book);
    sigs.forEach((s) => {
      const last = book[s.symbol] && book[s.symbol][s.tf];
      if (last && last.length) s.price = rnd(last[last.length - 1].close);
    });
    state.book = book;
    state.signals = sigs;
    state.dataSource = source;
    state.updatedAt = Math.floor(Date.now() / 1000);
    state.fresh = true;
    if (sigs.length && !sigs.some((s) => s.id === state.selectedId)) state.selectedId = sigs[0].id;
    state.toasts = sigs.slice().sort((a, b) => b.rr1 - a.rr1).slice(0, 2);
    state.toastOn = state.toasts.length > 0;
    if (state.toastOn) scheduleToastHide();
    startCountUp(sigs.length);
  } catch (e) {
    state.error = "Живые свечи не загрузились, на странице остаётся снимок Bybit. " + (e && e.message ? e.message : "");
  } finally {
    state.loading = false;
    renderAll();
  }
}

let toastTimer = null;
function scheduleToastHide() {
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toastOn = false; renderToasts(); }, 6500);
}

let countRaf = 0;
function startCountUp(target) {
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { state.shown = target; const el = document.getElementById("heroNum"); if (el) el.textContent = String(target); return; }
  if (countRaf) cancelAnimationFrame(countRaf);
  const duration = 1100;
  let start = null;
  const step = (t) => {
    if (start == null) start = t;
    const p = Math.min(1, (t - start) / duration);
    const e = 1 - Math.pow(1 - p, 3);
    state.shown = Math.round(e * target);
    const el = document.getElementById("heroNum");
    if (el) el.textContent = String(state.shown);
    if (p < 1) countRaf = requestAnimationFrame(step);
  };
  state.shown = 0;
  countRaf = requestAnimationFrame(step);
}

  html += "<p>Сигнал ищется на последних трёх свечах выбранного таймфрейма. Стоп ставится за структуру плюс небольшой буфер ATR. Идеи с RR до тейка 1 ниже 1,2 отбрасываются.</p>";
  html += "<table><thead><tr><th>Сетап</th><th>Что должно быть</th><th>Вход и стоп</th><th>Цели</th></tr></thead><tbody>";
  html += "<tr><td>Пробой уровня</td><td>Диапазон 30 свечей (1,2–18%) и закрытие за его границей, объём ≥ 1,35× средней</td><td>Вход у закрытия пробоя, стоп за последним колебанием внутри диапазона</td><td>Тейк 1 = ширина диапазона, тейк 2 = 1,618×</td></tr>";
  html += "<tr><td>Отскок от уровня</td><td>Уровень, который цена тестировала ≥ 3 раз, и свеча с длинной тенью от него</td><td>Вход у закрытия отбоя, стоп за тенью и уровнем</td><td>Тейк 1 — следующий уровень или 1,8R, тейк 2 — 3R</td></tr>";
  html += "<tr><td>Откат по тренду</td><td>EMA20 и EMA50 в одну сторону, был вынос, затем касание EMA20 и закрытие обратно</td><td>Вход у закрытия, стоп за минимум (максимум) отката</td><td>Тейк 1 — прошлый экстремум или 1,8R, тейк 2 — 3R</td></tr>";
  html += "</tbody></table></section>";
  html += '<section class="section"><h2>Как часто правило доходило до тейка 1</h2><div class="cap">Снимок бэктеста, не живой трекер.</div>';
  html += "<p>" + esc(BACKTEST_NOTE) + "</p>";
  html += "<table><thead><tr><th>Сетап</th><th>Срабатываний</th><th>Тейк 1 первым</th><th>Стоп первым</th><th>Середина</th></tr></thead><tbody>";
  ["breakout","bounce","pullback"].forEach((k) => {
    html += "<tr><td>"+TYPE_LABEL[k]+"</td><td>"+BACKTEST[k].n+"</td><td>"+pct(BACKTEST[k].tp,BACKTEST[k].n)+"</td><td>"+pct(BACKTEST[k].sl,BACKTEST[k].n)+"</td><td>"+pct(BACKTEST[k].mid,BACKTEST[k].n)+"</td></tr>";
  });
  html += "</tbody></table>";
  html += "<p>Для отката безубыток при RR ≈ 2 около 33% тейков; факт 31,6% — около нуля без комиссий. Отскок 35,1% при типичном 1,8R тоже около нуля. Пробой слабее и чаще остаётся в середине горизонта. Это не обещание результата.</p>";
  html += "<p>Доска только показывает идеи. Ни одна кнопка не отправляет ордер на Bybit.</p></section>";
  return html;
}

function bindPage() {
  const page = document.getElementById("page");
  const refreshBtn = document.getElementById("refreshBtn");
  if (refreshBtn) refreshBtn.onclick = () => { buzz("medium"); refresh(); };
  page.querySelectorAll("[data-agent]").forEach((b) => b.addEventListener("click", () => {
    buzz("light");
    const k = b.getAttribute("data-agent");
    if (k === "risk") state.tab = "calc";
    else { state.typ = k; state.tab = "signals"; }
    renderAll();
  }));
  page.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => {
    buzz("light"); state.selectedId = b.getAttribute("data-open"); state.typ = "all"; state.tab = "signals"; renderAll();
  }));
  page.querySelectorAll("[data-pick]").forEach((b) => b.addEventListener("click", () => {
    buzz("medium"); state.selectedId = b.getAttribute("data-pick"); state.tab = "calc"; renderAll();
  }));
  page.querySelectorAll("[data-tf]").forEach((b) => b.addEventListener("click", () => { buzz("light"); state.tf = b.getAttribute("data-tf"); renderAll(); }));
  const typSel = document.getElementById("typSel");
  if (typSel) typSel.onchange = () => { state.typ = typSel.value; renderAll(); };
  const sideSel = document.getElementById("sideSel");
  if (sideSel) sideSel.onchange = () => { state.side = sideSel.value; renderAll(); };
  function bindNum(id, key) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("input", () => { state[key] = el.value; });
    el.addEventListener("change", () => { state[key] = el.value; renderPage(); bindPage(); });
  }
  bindNum("eqIn", "equity"); bindNum("riskIn", "riskPct"); bindNum("levIn", "lev");
}

function renderPage() {
  const page = document.getElementById("page");
  if (state.tab === "home") page.innerHTML = renderHome();
  else if (state.tab === "signals") page.innerHTML = renderSignals();
  else if (state.tab === "calc") page.innerHTML = renderCalc();
  else page.innerHTML = renderInfo();
  bindPage();
}
function renderAll() { renderChrome(); renderPage(); }

function init() {
  applyTelegram();
  document.getElementById("clock").textContent = fmtClock(Date.now());
  setInterval(() => { const el = document.getElementById("clock"); if (el) el.textContent = fmtClock(Date.now()); }, 1000);
  setInterval(() => { state.flip = !state.flip; if (state.tab === "home") renderPage(); }, 4200);
  const w = tg();
  if (w && w.onEvent) {
    w.onEvent("themeChanged", applyTelegram);
    w.onEvent("viewportChanged", applyTelegram);
  }
  renderAll();
  startCountUp(state.signals.length);
  scheduleToastHide();
  refresh();
}
init();
